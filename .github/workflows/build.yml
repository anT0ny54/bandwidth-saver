name: Build and Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  build:
    name: Build extension
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read manifest version
        id: version
        shell: bash
        run: echo "version=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')" >> "$GITHUB_OUTPUT"

      - name: Build extension
        run: bash ./build.sh --out ./dist

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: bandwidth-saver-${{ steps.version.outputs.version }}
          path: dist/bandwidth-saver-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # The release job needs no source checkout: the build job's artifact is
      # the reproducible zip, and its file name carries the manifest version.
      # Reuse it instead of building again or reading the manifest a second time.
      - name: Checkout
  uses: actions/checkout@v5
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: bandwidth-saver-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish manifest version release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="dist/bandwidth-saver-${VERSION}.zip"
          test -f "$ZIP" || { echo "ERROR: missing $ZIP" >&2; exit 1; }

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} exists; replacing release asset."
            gh release upload "v${VERSION}" "$ZIP" --clobber
          else
            echo "Creating v${VERSION} release."
            gh release create "v${VERSION}" "$ZIP" \
              --target "$GITHUB_SHA" \
              --title "Bandwidth Saver v${VERSION}" \
              --generate-notes
          fi
