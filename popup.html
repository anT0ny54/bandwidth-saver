<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1120">
  <title>Bandwidth Saver</title>
  <style>
    :root {
      --brand-a: #1a3e99;
      --brand-b: #0891b2;
      --brand-c: #16a34a;
      --brand-grad: linear-gradient(135deg, var(--brand-a), var(--brand-b), var(--brand-c));

      --bg: #0b1120;
      --surface: #111827;
      --surface-2: #172033;
      --border: #263650;
      --text: #e5edf7;
      --muted: #8a9ab1;
      --accent: #16a4c5;
      --accent-soft: rgba(8,145,178,.13);
      --danger: #ef4444;
      --danger-soft: rgba(239,68,68,.12);
      --off: #3a4658;
      --radius: 15px;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f3f7fc;
        --surface: #fff;
        --surface-2: #f7f9fc;
        --border: #d7e0ed;
        --text: #142033;
        --muted: #66758a;
        --accent: #087f9a;
        --accent-soft: rgba(8,145,178,.09);
        --danger: #dc2626;
        --danger-soft: rgba(220,38,38,.09);
        --off: #9aa8bb;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--bg); }
    body {
      margin: 0;
      min-width: 280px;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    button, input { font: inherit; }
    button, a, input { -webkit-tap-highlight-color: transparent; }
    button { touch-action: manipulation; color: inherit; }
    a { color: var(--accent); }
    a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }

    .page {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      padding: 10px;
    }

    .card {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .hero {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 13px 14px 11px;
    }
    .hero-icon {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
    }
    .hero-copy { min-width: 0; }
    .hero-title {
      font-size: 14px;
      line-height: 1.2;
      font-weight: 800;
      background: var(--brand-grad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: var(--accent);
    }
    .hero-sub {
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 14px 12px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      border-radius: 50%;
      background: var(--off);
    }
    .status.active { color: var(--accent); }
    .status.active .status-dot { background: var(--accent); }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 62px;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }
    .switch-copy { min-width: 0; }
    .switch-title { display: block; font-size: 13px; font-weight: 700; }
    .switch-hint { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }

    .switch {
      -webkit-appearance: none;
      appearance: none;
      position: relative;
      width: 48px;
      height: 28px;
      flex: 0 0 48px;
      margin: 0;
      border: 0;
      border-radius: 999px;
      background: var(--off);
      cursor: pointer;
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.32);
      transition: transform .15s ease;
    }
    .switch:checked { background: var(--accent); }
    .switch:checked::after { transform: translateX(20px); }

    .card-dim { opacity: .48; pointer-events: none; }
    .section-label {
      padding: 11px 14px 6px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .presets {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      padding: 0 12px 12px;
    }
    .preset {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      min-height: 48px;
      padding: 7px 5px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
      text-align: center;
    }
    .preset.active { border-color: var(--accent); background: var(--accent-soft); }
    .p-label { display: block; font-size: 12px; font-weight: 800; }
    .p-hint { display: block; margin-top: 2px; color: var(--muted); font-size: 9px; line-height: 1.1; }
    .preset.active .p-label { color: var(--accent); }

    .nudge {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-top: 1px solid rgba(245,158,11,.25);
      background: rgba(245,158,11,.10);
      color: #b45309;
      font-size: 11px;
      font-weight: 600;
    }
    .nudge.show { display: flex; }
    .nudge-text { min-width: 0; }
    .nudge-btn {
      -webkit-appearance: none;
      appearance: none;
      flex: 0 0 auto;
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid rgba(245,158,11,.4);
      border-radius: 8px;
      background: rgba(245,158,11,.15);
      color: inherit;
      cursor: pointer;
      font-size: 10px;
      font-weight: 800;
    }

    .site {
      margin-top: 8px;
    }
    .site-row {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 54px;
      padding: 10px 13px;
    }
    .site-icon {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      color: var(--muted);
    }
    .site-copy { min-width: 0; flex: 1; }
    .site-caption { color: var(--muted); font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
    .site-host {
      margin-top: 1px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 800;
    }
    .site-pill {
      flex: 0 0 auto;
      padding: 3px 7px;
      border-radius: 999px;
      background: var(--danger-soft);
      color: var(--danger);
      font-size: 9px;
      font-weight: 800;
    }
    .btn-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      padding: 0 10px 10px;
    }
    .btn {
      -webkit-appearance: none;
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 44px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
    }
    .btn.primary { border-color: transparent; background: var(--brand-grad); color: #fff; }
    .btn:active { opacity: .78; }
    .btn:disabled { opacity: .4; cursor: default; }

    .footer-action { margin-top: 8px; }

    @media (max-width: 359px) {
      .presets { grid-template-columns: 1fr; }
      .preset { min-height: 42px; text-align: left; padding: 7px 11px; }
      .p-label, .p-hint { display: inline; }
      .p-hint { margin-left: 5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <header class="hero">
        <svg class="hero-icon" viewBox="0 0 36 36" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="logoGradient" x1="2" y1="2" x2="34" y2="34" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#1a3e99"/>
              <stop offset=".52" stop-color="#0891b2"/>
              <stop offset="1" stop-color="#22c55e"/>
            </linearGradient>
          </defs>
          <path d="M18 2 33 8v10.3C33 26.3 26.5 32 18 34 9.5 32 3 26.3 3 18.3V8l15-6Z" fill="url(#logoGradient)"/>
          <path d="m7 27 6-10 4 5 5-10 7 15" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity=".92"/>
          <path d="m10 24 8-4.2 8 2.8" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".84"/>
          <circle cx="10" cy="24" r="1.8" fill="#fff"/>
          <circle cx="18" cy="20" r="1.8" fill="#fff"/>
          <circle cx="26" cy="22.5" r="1.8" fill="#fff"/>
        </svg>
        <div class="hero-copy">
          <div class="hero-title">Bandwidth Saver</div>
          <div class="hero-sub" id="headerSub">Checking status…</div>
        </div>
      </header>

      <div class="status-row">
        <div class="status" id="statusState">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="statusText">Disabled</span>
        </div>
      </div>

      <label class="switch-row" for="enabled">
        <span class="switch-copy">
          <span class="switch-title">Enable compression</span>
          <span class="switch-hint">Route images through the proxy</span>
        </span>
        <input type="checkbox" id="enabled" class="switch">
      </label>

      <div class="nudge" id="nudge">
        <span class="nudge-text">Reload the page to apply changes.</span>
        <button class="nudge-btn" id="reloadBtn" type="button">Reload</button>
      </div>
    </section>

    <section class="card controls" id="ctrlCard">
      <label class="switch-row" for="grayscale">
        <span class="switch-copy">
          <span class="switch-title">Grayscale</span>
          <span class="switch-hint">B&amp;W images can use less data</span>
        </span>
        <input type="checkbox" id="grayscale" class="switch">
      </label>

      <div class="section-label">Quality</div>
      <div class="presets" id="qualityPresets">
        <button class="preset" data-q="45" type="button">
          <span class="p-label">Small</span>
          <span class="p-hint">Most saving</span>
        </button>
        <button class="preset" data-q="60" type="button">
          <span class="p-label">Normal</span>
          <span class="p-hint">Balanced</span>
        </button>
        <button class="preset" data-q="80" type="button">
          <span class="p-label">Sharp</span>
          <span class="p-hint">More detail</span>
        </button>
      </div>
    </section>

    <section class="card site">
      <div class="site-row">
        <svg class="site-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
          <path d="M3.5 12h17M12 3c2.4 2.5 3.4 5.5 3.4 9S14.4 18.5 12 21c-2.4-2.5-3.4-5.5-3.4-9S9.6 5.5 12 3Z" stroke="currentColor" stroke-width="1.4"/>
        </svg>
        <div class="site-copy">
          <div class="site-caption">Current site</div>
          <div class="site-host" id="siteName">—</div>
        </div>
        <span class="site-pill" id="sitePill" style="display:none"></span>
      </div>
      <div class="btn-row">
        <button id="excludeBtn" class="btn" type="button">Exclude this site</button>
      </div>
    </section>

    <div class="footer-action">
      <button id="settingsBtn" class="btn primary" type="button">Open settings</button>
    </div>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
